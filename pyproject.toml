[project]
name = "continual-llms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "deepspeed>=0.19.4",
    "huggingface-hub>=0.23",
    "numpy>=2.5.1",
    "pydantic>=2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "trl>=1.9.2",
    "wandb>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/continual_llms"]

[tool.uv]
# DeepSpeed ships sdist-only and its setup.py imports torch, so it cannot build in an
# isolated env that does not already have torch.
#
# NOTE: a `uv.toml` next to this file overrides this ENTIRE section rather than merging
# with it. If you add one (see uv.toml.example, e.g. to relocate the package cache), it
# must repeat no-build-isolation-package or `uv add deepspeed` will fail on a fresh env.
no-build-isolation-package = ["deepspeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
