# DeepSpeed ZeRO stage 2. Faster than ZeRO-3 on a PCIe-only link, because it communicates
# once per optimizer step instead of re-gathering parameters every micro-batch - but
# Qwen3-4B with fp32 Adam does not fit in 48 GB per GPU under it, and it OOMs at the first
# optimizer.step(). Kept for the sharding bake-off (scripts/01_bakeoff.sh), where it
# reports as `failed`. The memory arithmetic is in docs/engineering-notes.md.
#
# Launch:
#   set -a; source .env; set +a
#   uv run accelerate launch --config_file configs/accel/ds_zero2.yaml \
#       -m continual_llms.train.cpt --run-id my-run
#
# num_processes must match the number of devices in CUDA_VISIBLE_DEVICES.

compute_environment: LOCAL_MACHINE
debug: false
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_config_file: configs/accel/ds_zero2.json
  zero3_init_flag: false
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
# No mixed_precision here: with deepspeed_config_file set, accelerate raises at startup if
# this file also sets mixed_precision, gradient_accumulation_steps, gradient_clipping or
# zero_stage. bf16 comes from cpt_base.yaml via the JSON's "bf16": {"enabled": "auto"}.
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false