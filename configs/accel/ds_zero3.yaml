# DeepSpeed ZeRO stage 3. NOT the default - see configs/accel/ds_zero2.yaml for why.
# Present for the Task 3 bake-off.
#
# ds_zero3.json sets, and must keep setting:
#
#   stage3_gather_16bit_weights_on_model_save: true
#       MANDATORY. Without it, save_only_model writes partitioned shards that
#       from_pretrained cannot read. This pipeline writes no intermediate checkpoints, so
#       that failure is unrecoverable: the stage's work is simply gone.
#   stage3_param_persistence_threshold: 1e5
#       Parameters smaller than this stay resident instead of being re-gathered - norms,
#       biases, embeddings' small tensors. Cuts a lot of tiny all-gathers.
#   overlap_comm: true, contiguous_gradients: true
#       Overlap the reduce with backward compute, and keep gradients contiguous so the
#       reduce is one transfer rather than many.
#
# Anything that reads weights under stage 3 - the vocab_size assertion, parameter norms -
# MUST be wrapped in continual_llms.train.common.gathered_parameters(). Outside a gather context
# model.parameters() returns empty tensors, and a check that reads a partitioned tensor and
# passes is worse than no check.
#
# Launch:
#   uv run accelerate launch --config_file configs/accel/ds_zero3.yaml \
#       -m continual_llms.train.cpt --run-id my-run

# CPU optimizer offload is NOT available on this machine. Setting
#   "offload_optimizer": {"device": "cpu"}
# in ds_zero3.json makes DeepSpeed require DeepSpeedCPUAdam, which it JIT-compiles at first
# use - and that fails here:
#   CUDAMismatchException: Installed CUDA version 12.4 does not match the version torch was
#   compiled with 13.0, unable to compile cuda/cpp extensions
# No DeepSpeed native op can be built until the system CUDA toolkit matches torch's. ZeRO-2
# and ZeRO-3 themselves need no compiled ops, so everything else works. Memory headroom has
# to come from the GPU side instead: stage3_max_live_parameters, eval batch size, and
# PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True in .env.

compute_environment: LOCAL_MACHINE
debug: false
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_config_file: configs/accel/ds_zero3.json
  zero3_init_flag: true
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
# NO mixed_precision here. When `deepspeed_config_file` is set, accelerate refuses to also
# take mixed_precision/gradient_accumulation_steps/gradient_clipping/zero_stage from this
# file - it raises rather than silently ignoring them. bf16 comes from `bf16: true` in
# configs/train/cpt_base.yaml, which HF Trainer substitutes into the JSON's
# `"bf16": {"enabled": "auto"}`. Adding it back here breaks every run at startup.
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false