# DeepSpeed ZeRO stage 3 - the configuration that fits Qwen3-4B on two 48 GB GPUs. It also
# shards parameters, which saves the ~4 GB/GPU that ZeRO-2 is short of.
#
# ds_zero3.json must keep:
#   stage3_gather_16bit_weights_on_model_save: true
#       Without it save_only_model writes partitioned shards that from_pretrained cannot
#       read, and with no intermediate checkpoints the stage's work would be lost.
#   stage3_param_persistence_threshold: 1e4
#       Small parameters (norms, biases) stay resident instead of being re-gathered. Lower
#       keeps fewer resident, trading memory for more re-gathers.
#   overlap_comm: true, contiguous_gradients: true
#       Overlap the reduce with backward compute and keep it a single transfer.
#
# Anything that reads weights under stage 3 (the vocab_size assertion, parameter norms) must
# be wrapped in continual_llms.train.common.gathered_parameters(): outside a gather context
# model.parameters() returns empty tensors, and a check that passes on those is worse than
# no check.
#
# CPU optimizer offload is disabled. It needs DeepSpeed's JIT-compiled CPU Adam op, which
# only builds when the system CUDA toolkit matches the one torch was built with. Memory
# headroom comes from the GPU side instead: stage3_max_live_parameters, eval batch size, and
# PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True in .env.
#
# Launch:
#   uv run accelerate launch --config_file configs/accel/ds_zero3.yaml \
#       -m continual_llms.train.cpt --run-id my-run

compute_environment: LOCAL_MACHINE
debug: false
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_config_file: configs/accel/ds_zero3.json
  zero3_init_flag: true
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
# No mixed_precision here: with deepspeed_config_file set, accelerate raises at startup if
# this file also sets mixed_precision, gradient_accumulation_steps, gradient_clipping or
# zero_stage. bf16 comes from cpt_base.yaml via the JSON's "bf16": {"enabled": "auto"}.
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false